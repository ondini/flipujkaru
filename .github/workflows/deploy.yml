name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Stripe Price ID (nejsou tajné). Nenastavené → LIVE výchozí v src/config/billing.js.
          VITE_STRIPE_PRICE_MONTHLY: ${{ vars.VITE_STRIPE_PRICE_MONTHLY }}
          VITE_STRIPE_PRICE_QUARTERLY: ${{ vars.VITE_STRIPE_PRICE_QUARTERLY }}
          VITE_STRIPE_PRICE_YEARLY: ${{ vars.VITE_STRIPE_PRICE_YEARLY }}

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=flipujkaru --branch=main
